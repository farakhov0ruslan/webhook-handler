[[tool.uv.index]]
name = "core"
url = "https://gitlab.infra.salestrigger.io/api/v4/groups/2/-/packages/pypi/simple"
authenticate = "always"

[project]
name = "webhook-handler"
version = "0.0.1"
requires-python = ">=3.12.4,<4.0"
dependencies = [
    "utils-library[full]>=0.0.120",
    "notification-registry==0.0.1rc1+local.d015444",
    "httpx>=0.27",
]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-mock",
    "pytest-cov",
    "polyfactory>=2",
    "respx>=0.21",
    "freezegun",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "F", "E", "W", "S", "B", "C4", "PIE", "T20", "SIM", "TID", "ERA"]
ignore = ["B008", "E501", "S104", "S101"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
addopts = "--cov=webhook_handler --cov-report=term-missing"
testpaths = ["tests"]

